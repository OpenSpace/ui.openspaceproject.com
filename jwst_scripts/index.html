      // Helper function to connect to OpenSpace
      let connectToOpenSpace = () => {
        // Setup the api params
        let host = document.getElementById('ipaddress').value;
        if (!host) {
          // Host is empty, default to localhost
          host = 'localhost';
        }
        let api = window.openspaceApi(host, 4682);
        // Notify users on disconnect

          console.log('disconnected');
          document.getElementById('container').className = 'disconnected';
          document.getElementById('connection-status').style.opacity = 1;
          let disconnectedString = 'Connect to OpenSpace: ';

          document.getElementById('connection-status').innerHTML = disconnectedString;

            document.getElementById('connection-status').innerHTML = '';

            console.log('connected');
            mapButtons(openspace);

            return;

      // Function that takes in a ra dec coordinate and converts it into a cartesian coordinate in galactic reference frame
      function convertRaDec(
        RA_hours,
        RA_minutes,
        RA_seconds,
        Dec_degrees,
        Dec_minutes,
        Dec_seconds
      ) {
        let distance = 9.2e15;

        let a = RA_hours * 15.0 + (RA_minutes * 15) / 60.0 + (RA_seconds * 15) / 3600.0;
        let d =
          (Math.abs(Dec_degrees) + Dec_minutes / 60.0 + Dec_seconds / 3600.0) *
          Math.sign(Dec_degrees);

        a = a * (Math.PI / 180.0);
        d = d * (Math.PI / 180.0);

        // J2000
        const A0 = 192.8595 * (Math.PI / 180.0);
        const D0 = 27.1284 * (Math.PI / 180.0);
        const L0 = 122.932 * (Math.PI / 180.0);

        // Convert to galactic reference frame
        let l =
          L0 -
          Math.atan2(
            Math.cos(d) * Math.sin(a - A0),
            Math.sin(d) * Math.cos(D0) - Math.cos(d) * Math.sin(D0) * Math.cos(a - A0)
          );
        let b = Math.asin(
          Math.sin(d) * Math.sin(D0) + Math.cos(d) * Math.cos(D0) * Math.cos(a - A0)
        );

        let X = distance * Math.cos(b) * Math.cos(l);
        let Y = distance * Math.cos(b) * Math.sin(l);
        let Z = distance * Math.sin(b);

        return [X, Y, Z];
      }

      function normalize(v) {
        let l = length(v);
        v[0] = v[0] / l;
        v[1] = v[1] / l;
        v[2] = v[2] / l;
      }

      function length(v) {
        return Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
      }

      function applyMatrix(m, v) {
        let res = [0.0, 0.0, 0.0];
        res[0] = m[1] * v[0] + m[2] * v[1] + m[3] * v[2]; //ax + by + cz
        res[1] = m[4] * v[0] + m[5] * v[1] + m[6] * v[2]; //dx + ey + fz
        res[2] = m[7] * v[0] + m[8] * v[1] + m[9] * v[2]; //gx + hy + iz
        return res;
      }

      // Function that calculates the new x and y local angles of JWST to point towards the input coordinate
      function calculateJWSTAngles(cx, cy, cz) {
        // Normalize
        c = [cx, cy, cz];
        normalize(c);

        // Then Calculate the angle for X and Y seperatly
        let newXAngle = Math.asin(-c[1]); // asin(-cy)
        let newYAngle = 0.0;

        let op1 = Math.asin(c[0] / Math.cos(newXAngle)); // asin(cx/(cos(asin(-cy))))
        let op2 = Math.acos(c[2] / Math.cos(newXAngle)); // acos(cz/(cos(asin(-cy))))

        // Choose option 1 or 2
        // Same
        if (Math.abs(op1 - op2) < 0.00001) {
          newYAngle = op1;
        }
        // Same but different signs
        else if (Math.abs(Math.abs(op1) - Math.abs(op2)) < 0.00001) {
          newYAngle = op1;
        }
        // Different and same signs
        else if (Math.sign(op1) == Math.sign(op2)) {
          newYAngle = op2;
        }
        // Different and different signs
        else {
          newYAngle = -op2;
        }

        return [newXAngle, newYAngle];
      }

      function resetJWST(openspace) {

      function isInputValid(ra_h, ra_m, ra_s, dec_d, dec_m, dec_s) {
        // Empty
        if (
          ra_h == '' ||
          ra_m == '' ||
          ra_s == '' ||
          dec_d == '' ||
          dec_m == '' ||
          dec_s == ''
        ) {
          let messageString =
            'Warning: At least one of the coordinate input fields were empty';
          logMessage(messageString);
          return false;
        }

        // Numbers
        if (
          isNaN(ra_h) ||
          isNaN(ra_m) ||
          isNaN(ra_s) ||
          isNaN(dec_d) ||
          isNaN(dec_m) ||
          isNaN(dec_s)
        ) {
          let messageString = 'Warning: All coordinate input fields must be numbers';
          logMessage(messageString);
          return false;
        }

        // Ra
        if (ra_h < 0.0 || ra_h >= 24.0) {
          let messageString =
            'Warning: Right ascension hours is outside the allowed range of 0 to 24 hours (exclusive)';
          logMessage(messageString);
          return false;
        }
        if (ra_m < 0.0 || ra_m >= 60.0) {
          let messageString =
            'Warning: Right ascension minutes is outside the allowed range of 0 to 60 minutes (exclusive)';
          logMessage(messageString);
          return false;
        }
        if (ra_s < 0.0 || ra_s >= 60.0) {
          let messageString =
            'Warning: Right ascension seconds is outside the allowed range of 0 to 60 seconds (exclusive)';
          logMessage(messageString);
          return false;
        }

        // Dec
        if (dec_d < -90.0 || dec_d > 90.0) {
          let messageString =
            'Warning: Declination degrees is outside the allowed range of -90 to 90 degrees (inclusive)';
          logMessage(messageString);
          return false;
        } else if ((dec_d == -90.0 || dec_d == 90.0) && (dec_m != 0 || dec_s != 0)) {
          let messageString =
            'Warning: Total declination is outside the allowed range of -90 to 90 degrees (inclusive)';
          logMessage(messageString);
          return false;
        }
        if (dec_m < 0.0 || dec_m >= 60.0) {
          let messageString =
            'Warning: Declination minutes is outside the allowed range of 0 to 60 minutes (exclusive)';
          logMessage(messageString);
          return false;
        }
        if (dec_s < 0.0 || dec_s >= 60.0) {
          let messageString =
            'Warning: Declination seconds is outside the allowed range of 0 to 60 seconds (exclusive)';
          logMessage(messageString);
          return false;
        }

        return true;
      }

      async function directJWST(openspace) {
        if (openspace == null) {
          console.log('Error: No connection to an OpenSpace application');
          return;
        }

        // Get input
        let ra_h = document.getElementById('rah').value;
        let ra_m = document.getElementById('ram').value;
        let ra_s = document.getElementById('ras').value;

        let dec_d = document.getElementById('decd').value;
        let dec_m = document.getElementById('decm').value;
        let dec_s = document.getElementById('decs').value;

        let RA = ra_h.toString() + 'h' + ra_m.toString() + 'm' + ra_s.toString() + 's';
        let DEC =
          dec_d.toString() + 'd' + dec_m.toString() + 'm' + dec_s.toString() + 's';
        let distJS = 9.2e15;

        // Check input
        if (!isInputValid(ra_h, ra_m, ra_s, dec_d, dec_m, dec_s)) {
          return;
        }

        // Convert ra dec coordinate to cartesian coordinate in solar system reference frame
        let coordinates = convertRaDec(ra_h, ra_m, ra_s, dec_d, dec_m, dec_s);

        // Get JWST position
        const JWSTPosition = await openspace.worldPosition('JWSTModel');
        if (JWSTPosition == null) {
          let errorString =
            'Error: Could not find the JWST model inside the connected OpenSpace instance';
          console.log(errorString);
          document.getElementById('connection-status').style.opacity = 1;
          document.getElementById('connection-status').innerHTML = errorString;
          return;
        }

        // Calculate the vector from JWST towards the coordinate
        let JWSTtoCoord = [
          coordinates[0] - JWSTPosition[0],
          coordinates[1] - JWSTPosition[1],
          coordinates[2] - JWSTPosition[2]
        ];

        // Apply the worldRotation before calculating the angles
        const JWSTRotation = await openspace.worldRotation('JWSTRotation');
        if (JWSTRotation == null) {
          let errorString =
            'Error: Could not find the JWST rotation inside the connected OpenSpace instance';
          console.log(errorString);
          document.getElementById('connection-status').style.opacity = 1;
          document.getElementById('connection-status').innerHTML = errorString;
          return;
        }
        let JWSTtoCoordRotated = applyMatrix(JWSTRotation, JWSTtoCoord);

        // Calculate the JWST new angles to be pointing towards the coordinate
        let JWSTAngles = calculateJWSTAngles(
          JWSTtoCoordRotated[0],
          JWSTtoCoordRotated[1],
          JWSTtoCoordRotated[2]
        );

        // Check if the new angle violate the sunshield
        // -45 deg to 5 deg is valid in x rotation
        if (JWSTAngles[0] < -0.785398163 || JWSTAngles[0] > 0.0872664626) {
          logMessage('Warning: Coordinate violates the sunshield');
        } else {
          console.log('Coordinate is valid for sunshield');
        }

        let timing = parseInt(document.getElementById('rotation-time').value);
        console.log(timing);
        openspace.setPropertyValueSingle(
          'Scene.JWSTModel.Rotation.Rotation',
          [JWSTAngles[0], JWSTAngles[1], 0.0],
          timing
        );
      }

      function convertHMStoDeg() {
        let RA_hours = document.getElementById('rah').value;
        let RA_minutes = document.getElementById('ram').value;
        let RA_seconds = document.getElementById('ras').value;

        let Dec_d = document.getElementById('decd').value;
        let Dec_minutes = document.getElementById('decm').value;
        let Dec_seconds = document.getElementById('decs').value;

        let RA_degrees =
          RA_hours * 15.0 + (RA_minutes * 15) / 60.0 + (RA_seconds * 15) / 3600.0;
        let DEC_degrees =
          (Math.abs(Dec_d) + Dec_minutes / 60.0 + Dec_seconds / 3600.0) *
          Math.sign(Dec_d);

        return [RA_degrees, DEC_degrees];
      }

      function convertDegtoHMS() {
        let RA_degrees = document.getElementById('ra-deg').value;
        let DEC_degrees = document.getElementById('dec-deg').value;

        let RA_hours = Math.trunc(RA_degrees / 15.0);
        let rest = RA_degrees / 15.0 - RA_hours;
        let RA_minutes = Math.trunc(rest * 60);
        rest = rest * 60 - RA_minutes;
        let RA_seconds = rest * 60;

        let Dec_d = Math.trunc(DEC_degrees);
        rest = Math.abs(DEC_degrees) - Math.abs(Dec_d);
        let Dec_minutes = Math.trunc(rest * 60);
        rest = rest * 60 - Dec_minutes;
        let Dec_seconds = rest * 60;

        return [RA_hours, RA_minutes, RA_seconds, Dec_d, Dec_minutes, Dec_seconds];
      }

            onkeypress="this.onchange()"
            onpaste="this.onchange()"
            oninput="this.onchange()"
          />
        </div>
        <div id="right-col" class="card two-text-column">
          Ra:
          <input
            id="ra-deg"
            type="text"
            class="coord degree"
            placeholder="Degrees"
            onchange="raDegHandler()"
            onkeypress="this.onchange()"
            onpaste="this.onchange()"
            oninput="this.onchange()"
          />
          <br />
          Dec:
          <input
            id="dec-deg"
            type="text"
            class="coord degree"
            placeholder="Degrees"
            onchange="decDegHandler()"
            onkeypress="this.onchange()"
            onpaste="this.onchange()"
            oninput="this.onchange()"
          />
        </div>
      </div>
      <div class="card">
        <button onClick="pointToRaDec();">Enter</button>
        <button onClick="reset();">Reset</button>
        Show images:
        <input type="checkbox" id="showImagesCheck" onclick="showImagesCheckOnChange()" />
        <br />
        <button onClick="pointToHUDF();">Point To HUDF</button>
        <button onClick="pointToOrion();">Point To Orion Nebula</button>
        <button onClick="pointToM51();">Point To M51</button>
        <br />
        <button onClick="pointToTrifid();">Point To Trifid Nebula</button>
        <button onClick="pointToM82();">Point To M82</button>
        <button onClick="pointToHH212();">Point To HH 212</button>
        <br />
        <button onClick="pointToRing();">Point To the Ring Nebula</button>
        <button onClick="pointToCrab();">Point To the Crab Nebula</button>
        <br />
        <button onClick="pointToSN1987a();">Point To Supernova SN 1987a</button>
        <button onClick="pointToHD84406();">Point To HD 84406</button>
        <br />
        <br />
        Rotation time (seconds): <br />
        <input
          type="range"
          min="0"
          max="120"
          value="3"
          class="slider"
          id="rotation-time"
        />
        <div style="display: inline" id="rotation-time-value"></div>
        s
      </div>
      <div id="main"></div>
      <script type="text/javascript">
        connectToOpenSpace();

        let slider = document.getElementById('rotation-time');
        let output = document.getElementById('rotation-time-value');
        slider.value = 3;
        output.innerHTML = slider.value;
        slider.oninput = function () {
          output.innerHTML = this.value;
        };
      </script>
    </div>
  </body>
</html>
